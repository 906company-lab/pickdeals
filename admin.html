<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — PickDeals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c; --surface: #151515; --s2: #1c1c1c; --border: #262626;
    --accent: #ff6b35; --text: #f0ece4; --muted: #6a6762; --red: #e53935; --green: #4caf50;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  /* LOGIN SCREEN */
  #loginScreen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 1rem;
  }
  .login-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 380px;
    text-align: center;
  }
  .login-box .icon { font-size: 2.5rem; margin-bottom: 1rem; display: block; }
  .login-box h2 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em;
    margin-bottom: 0.5rem;
  }
  .login-box p { color: var(--muted); font-size: 0.87rem; margin-bottom: 1.5rem; }
  .login-box input {
    width: 100%; background: var(--s2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 12px 16px;
    font-family: inherit; font-size: 0.95rem; outline: none; margin-bottom: 12px;
    transition: border 0.2s; text-align: center; letter-spacing: 0.1em;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button {
    width: 100%; background: var(--accent); border: none; color: #fff;
    border-radius: 10px; padding: 12px;
    font-family: 'Bricolage Grotesque', sans-serif; font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  .login-box button:hover { background: #e05527; }
  .login-err { color: var(--red); font-size: 0.82rem; margin-top: 8px; display: none; }

  /* ADMIN APP */
  #adminApp { display: none; }

  /* TOPBAR */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(12,12,12,0.9); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 clamp(1rem,5vw,3rem); height: 58px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-logo {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 1.1rem; font-weight: 800; letter-spacing: -0.03em;
    display: flex; align-items: center; gap: 8px;
  }
  .topbar-logo .tag {
    background: rgba(255,107,53,0.15); border: 1px solid rgba(255,107,53,0.3);
    color: var(--accent); font-size: 0.68rem; font-weight: 700;
    padding: 3px 8px; border-radius: 5px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .topbar-right { display: flex; gap: 10px; align-items: center; }
  .btn-sm {
    border-radius: 8px; padding: 7px 14px;
    font-family: inherit; font-size: 0.82rem; font-weight: 500;
    cursor: pointer; transition: all 0.18s; border: 1px solid var(--border);
    background: var(--s2); color: var(--muted); text-decoration: none;
  }
  .btn-sm:hover { background: var(--border); color: var(--text); }
  .btn-sm.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-sm.primary:hover { background: #e05527; }
  .btn-sm.danger { border-color: transparent; }
  .btn-sm.danger:hover { border-color: var(--red); color: var(--red); background: rgba(229,57,53,0.1); }

  /* MAIN */
  .main { padding: clamp(1.5rem,4vw,2.5rem) clamp(1rem,5vw,3rem); max-width: 1100px; margin: 0 auto; }

  .page-title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em;
    margin-bottom: 1.5rem;
  }

  /* ADD FORM */
  .form-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem;
  }
  .form-card h3 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 1rem; font-weight: 700; margin-bottom: 1.2rem;
    display: flex; align-items: center; gap: 8px;
  }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .fg { display: flex; flex-direction: column; gap: 5px; }
  .fg.wide { grid-column: 1 / -1; }
  label { font-size: 0.72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  input, select {
    background: var(--s2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 9px 12px;
    font-family: inherit; font-size: 0.88rem; outline: none; transition: border 0.18s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  select option { background: var(--s2); }

  .form-actions { display: flex; gap: 10px; margin-top: 1.2rem; flex-wrap: wrap; }
  .btn {
    background: var(--accent); border: none; color: #fff;
    border-radius: 9px; padding: 10px 20px;
    font-family: 'Bricolage Grotesque', sans-serif; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: background 0.18s;
  }
  .btn:hover { background: #e05527; }
  .btn.secondary {
    background: var(--s2); border: 1px solid var(--border);
    color: var(--text);
  }
  .btn.secondary:hover { background: var(--border); }

  /* PRODUCT LIST */
  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem; flex-wrap: wrap; gap: 10px;
  }
  .list-title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 1.1rem; font-weight: 700;
  }
  .list-search {
    background: var(--s2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 14px;
    font-family: inherit; font-size: 0.85rem; outline: none; width: 220px;
    transition: border 0.18s;
  }
  .list-search:focus { border-color: var(--accent); }
  .list-search::placeholder { color: var(--muted); }

  .plist { display: flex; flex-direction: column; gap: 8px; }
  .prow {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px;
    display: flex; align-items: center; gap: 14px;
    transition: border-color 0.18s;
  }
  .prow:hover { border-color: rgba(255,107,53,0.3); }
  .prow-thumb {
    width: 50px; height: 50px; border-radius: 8px;
    background: var(--s2); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; overflow: hidden;
  }
  .prow-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
  .prow-info { flex: 1; min-width: 0; }
  .prow-name {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 0.9rem; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .prow-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .prow-price-new { color: var(--accent); font-size: 0.85rem; font-weight: 700; }
  .prow-price-old { color: var(--muted); text-decoration: line-through; font-size: 0.78rem; }
  .prow-cat {
    background: var(--s2); border: 1px solid var(--border);
    color: var(--muted); font-size: 0.68rem; padding: 2px 7px;
    border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .prow-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .act-btn {
    background: var(--s2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 7px;
    padding: 6px 12px; font-family: inherit; font-size: 0.78rem;
    cursor: pointer; transition: all 0.15s;
  }
  .act-btn:hover { background: var(--border); color: var(--text); }
  .act-btn.del:hover { border-color: var(--red); color: var(--red); background: rgba(229,57,53,0.08); }

  /* SAVE BAR */
  .save-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(12,12,12,0.95); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 14px clamp(1rem,5vw,3rem);
    display: flex; align-items: center; justify-content: space-between;
    transform: translateY(100%); transition: transform 0.3s;
    z-index: 80;
  }
  .save-bar.show { transform: translateY(0); }
  .save-bar-text { font-size: 0.87rem; color: var(--muted); }
  .save-bar-text strong { color: var(--text); }
  .save-bar-actions { display: flex; gap: 10px; }

  /* TOAST */
  .toast {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-10px);
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 10px 20px; border-radius: 100px;
    font-size: 0.85rem; opacity: 0; transition: all 0.3s;
    pointer-events: none; z-index: 999; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: rgba(76,175,80,0.4); color: var(--green); }
  .toast.error { border-color: rgba(229,57,53,0.4); color: var(--red); }

  /* EMPTY */
  .no-products { text-align: center; padding: 3rem; color: var(--muted); }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
    .prow { flex-wrap: wrap; }
    .prow-actions { width: 100%; justify-content: flex-end; }
    .list-search { width: 100%; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <span class="icon">🔐</span>
    <h2>Admin Panel</h2>
    <p>Masukkan password admin untuk melanjutkan</p>
    <input type="password" id="passInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Masuk</button>
    <div class="login-err" id="loginErr">Password salah!</div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminApp">

  <div class="topbar">
    <div class="topbar-logo">
      PickDeals <span class="tag">Admin</span>
    </div>
    <div class="topbar-right">
      <a href="/" class="btn-sm" target="_blank">👁 Lihat Website</a>
      <button class="btn-sm danger" onclick="logout()">Keluar</button>
    </div>
  </div>

  <div class="main">
    <div class="page-title">Kelola Produk</div>

    <!-- ADD / EDIT FORM -->
    <div class="form-card" id="formCard">
      <h3 id="formTitle">➕ Tambah Produk Baru</h3>
      <div class="form-grid">
        <div class="fg wide">
          <label>Nama Produk *</label>
          <input type="text" id="fName" placeholder="Contoh: Sepatu Sneakers Premium">
        </div>
        <div class="fg">
          <label>Harga Asli (Rp)</label>
          <input type="number" id="fOld" placeholder="150000">
        </div>
        <div class="fg">
          <label>Harga Diskon (Rp) *</label>
          <input type="number" id="fNew" placeholder="89000">
        </div>
        <div class="fg wide">
          <label>Link Shopee Affiliate *</label>
          <input type="url" id="fLink" placeholder="https://shope.ee/...">
        </div>
        <div class="fg wide">
          <label>URL Gambar Produk (opsional)</label>
          <input type="url" id="fImg" placeholder="https://... (biarkan kosong pakai emoji)">
        </div>
        <div class="fg">
          <label>Emoji (jika tanpa gambar)</label>
          <input type="text" id="fEmoji" placeholder="📱" maxlength="4">
        </div>
        <div class="fg">
          <label>Kategori *</label>
          <input type="text" id="fCat" placeholder="Elektronik, Fashion, dll" list="catList">
          <datalist id="catList"></datalist>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="saveProduct()">Simpan Produk</button>
        <button class="btn secondary" id="cancelBtn" onclick="cancelEdit()" style="display:none">Batal Edit</button>
      </div>
    </div>

    <!-- LIST -->
    <div class="list-head">
      <div class="list-title" id="listTitle">Semua Produk (0)</div>
      <input type="text" class="list-search" id="listSearch" placeholder="🔍 Cari produk..." oninput="renderList()">
    </div>
    <div class="plist" id="plist">
      <div class="no-products">Memuat produk...</div>
    </div>
  </div>

</div>

<!-- SAVE BAR -->
<div class="save-bar" id="saveBar">
  <div class="save-bar-text">Ada <strong id="changeCount">0</strong> perubahan belum tersimpan</div>
  <div class="save-bar-actions">
    <button class="btn secondary" onclick="discardChanges()">Buang</button>
    <button class="btn" onclick="publishChanges()" id="pubBtn">🚀 Publish Perubahan</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let adminPass = '';
let products = [];
let editIdx = null;
let hasChanges = false;

// ── LOGIN ──
function doLogin() {
  const p = document.getElementById('passInput').value.trim();
  if (!p) return;
  adminPass = p;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminApp').style.display = 'block';
  loadProducts();
}

function logout() {
  adminPass = '';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminApp').style.display = 'none';
  document.getElementById('passInput').value = '';
}

// ── LOAD ──
async function loadProducts() {
  try {
    const r = await fetch('/api/products?t=' + Date.now());
    products = await r.json();
    hasChanges = false;
    updateSaveBar();
    renderList();
    updateCatList();
  } catch(e) {
    toast('❌ Gagal memuat produk', 'error');
  }
}

function formatRp(n) {
  return 'Rp ' + Number(n).toLocaleString('id-ID');
}

// ── RENDER LIST ──
function renderList() {
  const q = document.getElementById('listSearch').value.toLowerCase().trim();
  const filtered = q ? products.filter(p => p.name.toLowerCase().includes(q)) : products;
  document.getElementById('listTitle').textContent = `Semua Produk (${products.length})`;

  const el = document.getElementById('plist');
  if (!filtered.length) {
    el.innerHTML = `<div class="no-products">Belum ada produk. Tambahkan di atas!</div>`;
    return;
  }

  el.innerHTML = '';
  filtered.forEach((p, fi) => {
    const ri = products.indexOf(p);
    const row = document.createElement('div');
    row.className = 'prow';
    row.innerHTML = `
      <div class="prow-thumb">
        ${p.image
          ? `<img src="${p.image}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${p.emoji||'📦'}'">` 
          : (p.emoji||'📦')}
      </div>
      <div class="prow-info">
        <div class="prow-name">${p.name}</div>
        <div class="prow-meta">
          <span class="prow-price-new">${formatRp(p.newPrice)}</span>
          ${p.oldPrice ? `<span class="prow-price-old">${formatRp(p.oldPrice)}</span>` : ''}
          ${p.category ? `<span class="prow-cat">${p.category}</span>` : ''}
        </div>
      </div>
      <div class="prow-actions">
        <button class="act-btn" onclick="editProduct(${ri})">✏️ Edit</button>
        <button class="act-btn del" onclick="deleteProduct(${ri})">🗑 Hapus</button>
      </div>
    `;
    el.appendChild(row);
  });
}

// ── SAVE PRODUCT ──
function saveProduct() {
  const name = document.getElementById('fName').value.trim();
  const oldP = parseFloat(document.getElementById('fOld').value) || 0;
  const newP = parseFloat(document.getElementById('fNew').value);
  const link = document.getElementById('fLink').value.trim();
  const img  = document.getElementById('fImg').value.trim();
  const emo  = document.getElementById('fEmoji').value.trim() || '📦';
  const cat  = document.getElementById('fCat').value.trim();

  if (!name || isNaN(newP) || newP <= 0 || !link) {
    toast('⚠️ Nama, harga diskon, dan link wajib diisi!', 'error');
    return;
  }

  const prod = {
    id: editIdx !== null ? products[editIdx].id : Date.now().toString(),
    name, oldPrice: oldP, newPrice: newP, link, image: img, emoji: emo, category: cat
  };

  if (editIdx !== null) {
    products[editIdx] = prod;
    toast('✅ Produk diupdate!', 'success');
    cancelEdit();
  } else {
    products.unshift(prod);
    toast('✅ Produk ditambahkan!', 'success');
  }

  clearForm();
  hasChanges = true;
  updateSaveBar();
  renderList();
  updateCatList();
}

// ── EDIT ──
function editProduct(idx) {
  editIdx = idx;
  const p = products[idx];
  document.getElementById('fName').value = p.name;
  document.getElementById('fOld').value = p.oldPrice || '';
  document.getElementById('fNew').value = p.newPrice;
  document.getElementById('fLink').value = p.link;
  document.getElementById('fImg').value = p.image || '';
  document.getElementById('fEmoji').value = p.emoji || '📦';
  document.getElementById('fCat').value = p.category || '';
  document.getElementById('formTitle').textContent = '✏️ Edit Produk';
  document.getElementById('cancelBtn').style.display = 'inline-flex';
  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cancelEdit() {
  editIdx = null;
  clearForm();
  document.getElementById('formTitle').textContent = '➕ Tambah Produk Baru';
  document.getElementById('cancelBtn').style.display = 'none';
}

function clearForm() {
  ['fName','fOld','fNew','fLink','fImg','fCat'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fEmoji').value = '📦';
}

// ── DELETE ──
function deleteProduct(idx) {
  if (!confirm(`Hapus "${products[idx].name}"?`)) return;
  products.splice(idx, 1);
  if (editIdx === idx) cancelEdit();
  hasChanges = true;
  updateSaveBar();
  renderList();
  toast('🗑️ Produk dihapus', 'success');
}

// ── SAVE BAR ──
function updateSaveBar() {
  const bar = document.getElementById('saveBar');
  document.getElementById('changeCount').textContent = products.length;
  if (hasChanges) bar.classList.add('show');
  else bar.classList.remove('show');
}

function discardChanges() {
  if (!confirm('Buang semua perubahan? Data akan dikembalikan ke versi terakhir.')) return;
  loadProducts();
}

// ── PUBLISH ──
async function publishChanges() {
  const btn = document.getElementById('pubBtn');
  btn.textContent = '⏳ Menyimpan...';
  btn.disabled = true;

  try {
    const r = await fetch('/api/update', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${adminPass}`
      },
      body: JSON.stringify({ products })
    });

    const data = await r.json();

    if (r.ok) {
      hasChanges = false;
      updateSaveBar();
      toast('🚀 Berhasil dipublish! Website live dalam ~30 detik', 'success');
    } else {
      if (r.status === 401) toast('❌ Password salah!', 'error');
      else toast('❌ Gagal: ' + (data.error || 'Unknown error'), 'error');
    }
  } catch(e) {
    toast('❌ Gagal terhubung ke server', 'error');
  }

  btn.textContent = '🚀 Publish Perubahan';
  btn.disabled = false;
}

// ── UTILS ──
function updateCatList() {
  const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
  const dl = document.getElementById('catList');
  dl.innerHTML = cats.map(c => `<option value="${c}">`).join('');
}

function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.className = 'toast', 3000);
}
</script>
</body>
</html>
