<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickDeals — Deal Terbaik Shopee</title>
<meta name="description" content="Temukan produk terbaik dengan harga terjangkau. Klik langsung ke Shopee!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c;
    --surface: #151515;
    --surface2: #1d1d1d;
    --border: #272727;
    --accent: #ff6b35;
    --accent-glow: rgba(255,107,53,0.2);
    --text: #f2ede6;
    --muted: #6e6b66;
    --card: #141414;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* NOISE OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(12,12,12,0.88);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 clamp(1rem,5vw,3rem);
    height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 1.35rem; font-weight: 800;
    letter-spacing: -0.04em;
    color: var(--text); text-decoration: none;
    display: flex; align-items: center; gap: 8px;
  }
  .logo-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .search-box {
    position: relative; display: flex; align-items: center;
  }
  .search-box input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 14px 8px 38px;
    font-family: inherit; font-size: 0.85rem;
    width: 200px; outline: none;
    transition: all 0.25s;
  }
  .search-box input:focus { border-color: var(--accent); width: 260px; }
  .search-box input::placeholder { color: var(--muted); }
  .search-box svg { position: absolute; left: 11px; color: var(--muted); width: 16px; pointer-events: none; }

  /* HERO */
  .hero {
    padding: clamp(3rem,7vw,5rem) clamp(1rem,5vw,3rem) 2rem;
    max-width: 1180px; margin: 0 auto;
    position: relative;
  }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,107,53,0.1);
    border: 1px solid rgba(255,107,53,0.25);
    color: var(--accent);
    padding: 6px 14px; border-radius: 100px;
    font-size: 0.78rem; font-weight: 500;
    margin-bottom: 1.2rem;
  }
  .hero-eyebrow span {
    width: 6px; height: 6px; background: var(--accent);
    border-radius: 50%; animation: blink 1.5s infinite;
  }
  .hero h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 4.2rem);
    font-weight: 800; line-height: 1.05;
    letter-spacing: -0.04em;
    margin-bottom: 1rem;
  }
  .hero h1 .hl {
    color: var(--accent);
    position: relative; display: inline-block;
  }
  .hero p {
    color: var(--muted); font-size: 1rem;
    max-width: 460px; margin-bottom: 2rem;
  }
  .hero-stats {
    display: flex; gap: 2.5rem; flex-wrap: wrap;
  }
  .stat { }
  .stat-n {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 1.8rem; font-weight: 800;
    color: var(--text);
  }
  .stat-l { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }

  /* CATEGORIES */
  .cats-wrap {
    padding: 0 clamp(1rem,5vw,3rem) 1.5rem;
    max-width: 1180px; margin: 0 auto;
  }
  .cats-label {
    font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  .cats {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .cat {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px; padding: 7px 15px;
    font-family: inherit; font-size: 0.83rem;
    cursor: pointer; transition: all 0.18s;
    white-space: nowrap;
  }
  .cat:hover { border-color: var(--accent); color: var(--text); }
  .cat.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* GRID */
  .grid-wrap {
    padding: 0 clamp(1rem,5vw,3rem) 5rem;
    max-width: 1180px; margin: 0 auto;
  }
  .grid-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.2rem;
  }
  .grid-title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 1.4rem; font-weight: 800; letter-spacing: -0.03em;
  }
  .grid-count { color: var(--muted); font-size: 0.82rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  /* CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
    text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
    transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
    animation: up 0.45s ease both;
  }
  @keyframes up { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
  .card:hover {
    transform: translateY(-5px);
    border-color: rgba(255,107,53,0.35);
    box-shadow: 0 18px 45px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,107,53,0.12);
  }
  .card-thumb {
    width: 100%; aspect-ratio: 1/1;
    position: relative; overflow: hidden;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
  }
  .card-thumb img {
    width: 100%; height: 100%; object-fit: cover;
    display: block; transition: transform 0.35s;
  }
  .card:hover .card-thumb img { transform: scale(1.04); }
  .card-emoji { font-size: 3.5rem; line-height: 1; }
  .badge-disc {
    position: absolute; top: 10px; left: 10px;
    background: #e53935; color: #fff;
    font-size: 0.68rem; font-weight: 700;
    padding: 3px 7px; border-radius: 5px;
  }
  .badge-cat {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,0.65);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.64rem; padding: 3px 7px; border-radius: 5px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .card-body {
    padding: 12px; flex: 1;
    display: flex; flex-direction: column; gap: 6px;
  }
  .card-name {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 0.88rem; font-weight: 700; line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-prices {
    display: flex; align-items: center; gap: 7px;
    flex-wrap: wrap; margin-top: auto;
  }
  .p-new {
    color: var(--accent);
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 1rem; font-weight: 800;
  }
  .p-old {
    color: var(--muted);
    text-decoration: line-through; font-size: 0.78rem;
  }
  .card-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--accent); color: #fff;
    border-radius: 9px; padding: 9px 12px;
    font-family: inherit; font-size: 0.8rem; font-weight: 600;
    text-decoration: none; margin-top: 4px;
    transition: background 0.18s, transform 0.15s;
    border: none; cursor: pointer; width: 100%;
  }
  .card-btn:hover { background: #e05527; transform: scale(0.98); }

  /* EMPTY */
  .empty {
    grid-column: 1/-1;
    text-align: center; padding: 5rem 2rem;
    color: var(--muted);
  }
  .empty-icon { font-size: 3rem; margin-bottom: 1rem; display: block; }

  /* LOADER */
  .loader {
    grid-column: 1/-1;
    display: flex; justify-content: center; padding: 3rem;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--border);
    padding: 2rem clamp(1rem,5vw,3rem);
    text-align: center; color: var(--muted); font-size: 0.8rem;
  }

  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .search-box input { width: 140px; }
    .search-box input:focus { width: 170px; }
    .hero-stats { gap: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <div class="logo-dot"></div>
    PickDeals
  </a>
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Cari produk...">
  </div>
</header>

<section class="hero">
  <div class="hero-eyebrow"><span></span> Update produk terbaru</div>
  <h1>Deal <span class="hl">Terbaik</span><br>Langsung ke Shopee</h1>
  <p>Produk pilihan kurasi khusus dengan harga terjangkau. Klik, beli, hemat.</p>
  <div class="hero-stats">
    <div class="stat">
      <div class="stat-n" id="sTotal">—</div>
      <div class="stat-l">Produk</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="sCat">—</div>
      <div class="stat-l">Kategori</div>
    </div>
  </div>
</section>

<div class="cats-wrap">
  <div class="cats-label">Kategori</div>
  <div class="cats" id="cats">
    <button class="cat on" data-cat="all">🔥 Semua</button>
  </div>
</div>

<div class="grid-wrap">
  <div class="grid-head">
    <div class="grid-title">Rekomendasi Produk</div>
    <div class="grid-count" id="gCount"></div>
  </div>
  <div class="grid" id="grid">
    <div class="loader"><div class="spinner"></div></div>
  </div>
</div>

<footer>
  © 2025 PickDeals · Semua link menuju Shopee Affiliate
</footer>

<script>
let allProducts = [];
let activeCat = 'all';
let search = '';

const CAT_EMOJI = {
  'Elektronik':'📱','Fashion':'👗','Kecantikan':'✨','Rumah':'🏠',
  'Makanan':'🍜','Olahraga':'⚽','Otomotif':'🚗','Buku':'📚'
};

async function loadProducts() {
  try {
    const r = await fetch('/api/products?t=' + Date.now());
    allProducts = await r.json();
  } catch(e) {
    allProducts = [];
  }
  renderAll();
}

function formatRp(n) {
  return 'Rp ' + Number(n).toLocaleString('id-ID');
}

function disc(o, n) {
  if (!o || o <= n) return null;
  return Math.round((1 - n/o) * 100);
}

function renderAll() {
  // stats
  const cats = [...new Set(allProducts.map(p=>p.category).filter(Boolean))];
  document.getElementById('sTotal').textContent = allProducts.length;
  document.getElementById('sCat').textContent = cats.length;

  // category buttons
  const catsEl = document.getElementById('cats');
  catsEl.innerHTML = `<button class="cat ${activeCat==='all'?'on':''}" data-cat="all">🔥 Semua</button>`;
  cats.forEach(c => {
    const em = CAT_EMOJI[c] || '';
    catsEl.innerHTML += `<button class="cat ${activeCat===c?'on':''}" data-cat="${c}">${em} ${c}</button>`;
  });
  catsEl.querySelectorAll('.cat').forEach(b => {
    b.addEventListener('click', () => { activeCat = b.dataset.cat; renderAll(); });
  });

  // filter
  let filtered = allProducts.filter(p => {
    const mc = activeCat === 'all' || p.category === activeCat;
    const ms = !search || p.name.toLowerCase().includes(search);
    return mc && ms;
  });

  document.getElementById('gCount').textContent = filtered.length + ' produk';

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty"><span class="empty-icon">🔍</span><p>Produk tidak ditemukan</p></div>`;
    return;
  }

  filtered.forEach((p, i) => {
    const d = disc(p.oldPrice, p.newPrice);
    const card = document.createElement('a');
    card.className = 'card';
    card.href = p.link || '#';
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.style.animationDelay = (i * 55) + 'ms';
    card.innerHTML = `
      <div class="card-thumb">
        ${p.image
          ? `<img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.parentElement.querySelector('.card-emoji').style.display='block'">`
          : ''}
        <div class="card-emoji" style="${p.image?'display:none':''}">${p.emoji||''}</div>
        ${d ? `<div class="badge-disc">-${d}%</div>` : ''}
        ${p.category ? `<div class="badge-cat">${p.category}</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-prices">
          <span class="p-new">${formatRp(p.newPrice)}</span>
          ${p.oldPrice ? `<span class="p-old">${formatRp(p.oldPrice)}</span>` : ''}
        </div>
        <a href="${p.link||'#'}" target="_blank" rel="noopener" class="card-btn" onclick="event.stopPropagation()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM1 2h2.6l.5 2.6M7 13h10l1.4-7H6.1"/><circle cx="9" cy="20" r="2"/></svg>
          Beli di Shopee
        </a>
      </div>
    `;
    grid.appendChild(card);
  });
}

document.getElementById('searchInput').addEventListener('input', function() {
  search = this.value.toLowerCase().trim();
  renderAll();
});

loadProducts();
</script>
</body>
</html>
